---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/component_v1alpha1.json
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - notification.yaml
replacements:
- source:
    kind: Namespace
    fieldPath: metadata.name
  targets:
  - select:
      kind: Provider
      name: discord
    fieldPaths:
      - metadata.namespace
    options:
        create: true
  - select:
      kind: Alert
      name: discord-info
    fieldPaths:
      - metadata.namespace
    options:
        create: true
  - select:
      kind: Alert
      name: discord-error
    fieldPaths:
      - metadata.namespace
    options:
        create: true        