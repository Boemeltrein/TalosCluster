---
# Keep internal route discovery and monitoring consistent across TrueCharts apps.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: not-used
spec:
  values:
    route:
      main:
        annotations:
          gatus.home-operations.com/enabled: 'true'
          gatus.home-operations.com/endpoint: |
            group: internal
            client:
              dns-resolver: "tcp://blocky-dns.blocky.svc.cluster.local:53"
            ui:
              hide-url: true
              hide-hostname: true
            {{- with .Values.gatus }}
            {{ toYaml . }}
            {{- end }}
