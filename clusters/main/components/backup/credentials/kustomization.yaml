apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: patch.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease

replacements:
  - source:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      fieldPath: metadata.name
    targets:
      - select:
          group: helm.toolkit.fluxcd.io
          version: v2
          kind: HelmRelease
        fieldPaths:
          - spec.values.credentials.minio.bucket
        options:
          delimiter: "-"
          index: 1
