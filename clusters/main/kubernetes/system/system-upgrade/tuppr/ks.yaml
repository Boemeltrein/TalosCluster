---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 10m
  timeout: 10m
  path: clusters/main/kubernetes/system/system-upgrade/tuppr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr-plans
  namespace: flux-system
spec:
  dependsOn:
    - name: tuppr
  interval: 1h
  retryInterval: 10m
  timeout: 10m
  path: clusters/main/kubernetes/system/system-upgrade/tuppr/plans
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  wait: false
