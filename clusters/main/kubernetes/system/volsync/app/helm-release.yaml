---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync
spec:
  interval: 1h
  chart:
    spec:
      chart: volsync
      version: 5.0.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:

    image:
      repository: quay.io/backube/volsync
      pullPolicy: IfNotPresent
      tag: 0.17.0@sha256:bbc884d4fa108534260025bf1255a1010ebb6bb8dac9ba4f4a77f437ca7f8fbd

    configmap:
      dashboard-volsync:
        enabled: false