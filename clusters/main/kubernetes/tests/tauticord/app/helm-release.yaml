---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tauticord
  namespace: tauticord
spec:
  interval: 15m
  chart:
    spec:
      chart: tauticord
      version: 10.11.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Amsterdam
    
    image:
      repository: codeberg.org/nwithan8/tauticord
      pullPolicy: IfNotPresent
      tag: 6.1.0@sha256:9aefe03e24090db0bbfc5b447ce4c150d9ab0c1d0f9c90d035af89d4846f956e