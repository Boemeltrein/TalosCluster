---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 15m
  chart:
    spec:
      chart: authentik
      version: 41.2.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Amsterdam

    image:
      repository: ghcr.io/goauthentik/server
      tag: 2026.8.0@sha256:7421753cfea67e89a6d295a1f0173ccea3866b33768c88dad90453b151cdcfd5
      pullPolicy: IfNotPresent
    geoipImage:
      repository: ghcr.io/maxmind/geoipupdate
      tag: v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
      pullPolicy: IfNotPresent
    ldapImage:
      repository: ghcr.io/goauthentik/ldap
      tag: 2026.8.0@sha256:ca356fd416528f15d6fd2c07ced9b414a0db902636efe378bf1bf45a86db31e7
      pullPolicy: IfNotPresent
    radiusImage:
      repository: ghcr.io/goauthentik/radius
      tag: 2026.8.0@sha256:a9dfe57b9b1c3958c78c780a01e06332497dbfdbbbe0bf6d9fc56ced8fc51e66
      pullPolicy: IfNotPresent
    proxyImage:
      repository: ghcr.io/goauthentik/proxy
      tag: 2026.8.0@sha256:896475410e78aafb82c605244b644a813e03806637798adbae6682dc5c3f8ff6
      pullPolicy: IfNotPresent
  
    authentik:
      credentials:
        email: ${EMAIL}
        password: ${AUTHENTIK_PASSW}
        # bootstrapToken: some_super_secret_token
      outposts:
        disableEmbeddedOutpost: true
        proxy:
          enabled: true
          token: some_super_secret_token
        radius:
          # Can't enable it before creating a
          # provider in the GUI
          enabled: false
          token: some_super_secret_token
        ldap:
          # Can't enable it before creating a
          # provider in the GUI
          enabled: false
          token: some_super_secret_token
          
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        hosts:
          - host: authentik.${BASE_DOMAIN}
          - host: librespeed.${BASE_DOMAIN}
            paths:
              - path: /outpost.goauthentik.io
                pathType: ImplementationSpecific
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare


