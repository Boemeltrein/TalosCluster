---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 15m
  chart:
    spec:
      chart: authentik
      version: 41.9.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Amsterdam

    image:
      repository: ghcr.io/goauthentik/server
      tag: 2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
      pullPolicy: IfNotPresent
    geoipImage:
      repository: ghcr.io/maxmind/geoipupdate
      tag: v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
      pullPolicy: IfNotPresent
    ldapImage:
      repository: ghcr.io/goauthentik/ldap
      tag: 2026.8.3@sha256:7114c560be4e24dc61080fe5bd7684cf0ebf4b0a6230a8247943ffa8957b73d4
      pullPolicy: IfNotPresent
    radiusImage:
      repository: ghcr.io/goauthentik/radius
      tag: 2026.8.3@sha256:d2e8ed0898a0f4788521e98e4a5b87f5e22071d8ecdbae8f64801fba88943568
      pullPolicy: IfNotPresent
    proxyImage:
      repository: ghcr.io/goauthentik/proxy
      tag: 2026.8.3@sha256:0d1ef18bc60d67199e983e5ee7b8be61e945fa223f5525b4c3a1a2525b21ca76
      pullPolicy: IfNotPresent
  
    authentik:
      credentials:
        email: ${EMAIL}
        password: ${AUTHENTIK_PASSW}
      outposts:
        disableEmbeddedOutpost: true
        proxy:
         enabled: true
         token: some_super_secret_token
        radius:
          # Can't enable it before creating a
          # provider in the GUI
          enabled: false
          token: some_super_secret_token
        ldap:
          # Can't enable it before creating a
          # provider in the GUI
          enabled: false
          token: some_super_secret_token
          
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        hosts:
          - host: authentik.${BASE_DOMAIN}
          - host: librespeed.${BASE_DOMAIN}
            paths:
              - path: /outpost.goauthentik.io
                pathType: ImplementationSpecific
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare
  
    # ===== PROXY =====
    workload:
      proxy:
        enabled: true
        type: Deployment
        podSpec:
          containers:
            proxy:
              enabled: true
              primary: true
              imageSelector: proxyImage
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
              envFrom:
                - configMapRef:
                    name: proxy
                - secretRef:
                    name: proxy
              probes:
                liveness:
                  enabled: false
                  type: http
                  port: 10231
                  path: /outpost.goauthentik.io/ping
                readiness:
                  enabled: false
                  type: http
                  port: 10231
                  path: /outpost.goauthentik.io/ping
                startup:
                  enabled: false
                  port: 10231
                  type: http
                  path: /outpost.goauthentik.io/ping
                  
    service:
      proxy:
        enabled: true
        targetSelector: proxy
        ports:
          http:
            enabled: true
            protocol: http
            port: 9000
            targetSelector: proxy
          https:
            enabled: true
            protocol: https
            port: 9443
            targetSelector: proxy
