---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 1h
  chart:
    spec:
      chart: authentik
      version: 42.0.7
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    image:
      repository: ghcr.io/goauthentik/server
      tag: 2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
      pullPolicy: IfNotPresent
    geoipImage:
      repository: ghcr.io/maxmind/geoipupdate
      tag: v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
      pullPolicy: IfNotPresent
    ldapImage:
      repository: ghcr.io/goauthentik/ldap
      tag: 2026.8.5@sha256:4c75bd27918418d2d6fbbfe4581bbd5a199fe38942d24559c4483edd64a1ea87
      pullPolicy: IfNotPresent
    radiusImage:
      repository: ghcr.io/goauthentik/radius
      tag: 2026.8.5@sha256:1d96012281d43a137b792765308d3aced51c1f6268d01cd108891e1706336f79
      pullPolicy: IfNotPresent
    proxyImage:
      repository: ghcr.io/goauthentik/proxy
      tag: 2026.8.5@sha256:34640cf41e009ab052d4b9119cea816713adcd1eaac95de6caefebfe86d3fcd9
      pullPolicy: IfNotPresent
  
    authentik:
      credentials:
        email: ${EMAIL}
        password: ${AUTHENTIK_PASSW}
      outposts:
        disableEmbeddedOutpost: true
        proxy:
         enabled: true
         token: some_super_secret_token
        radius:
          # Can't enable it before creating a
          # provider in the GUI
          enabled: false
          token: some_super_secret_token
        ldap:
          # Can't enable it before creating a
          # provider in the GUI
          enabled: false
          token: some_super_secret_token
          
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          nginx.ingress.kubernetes.io/ssl-passthrough: "true"
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        hosts:
          - host: authentik.${BASE_DOMAIN}
          - host: librespeed.${BASE_DOMAIN}
            paths:
              - path: /outpost.goauthentik.io
                pathType: ImplementationSpecific
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare
  
    # ===== PROXY =====
    workload:
      proxy:
        enabled: true
        type: Deployment
        podSpec:
          containers:
            proxy:
              enabled: true
              primary: true
              imageSelector: proxyImage
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
              envFrom:
                - configMapRef:
                    name: proxy
                - secretRef:
                    name: proxy
              probes:
                liveness:
                  enabled: false
                  type: http
                  port: 10231
                  path: /outpost.goauthentik.io/ping
                readiness:
                  enabled: false
                  type: http
                  port: 10231
                  path: /outpost.goauthentik.io/ping
                startup:
                  enabled: false
                  port: 10231
                  type: http
                  path: /outpost.goauthentik.io/ping
                  
    service:
      proxy:
        enabled: true
        targetSelector: proxy
        ports:
          http:
            enabled: true
            protocol: http
            port: 9000
            targetSelector: proxy
          https:
            enabled: true
            protocol: https
            port: 9443
            targetSelector: proxy
