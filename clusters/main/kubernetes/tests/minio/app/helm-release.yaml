---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.23.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  
  values:
    image:
      repository: quay.io/minio/aistor/minio
      tag: RELEASE.2026-09-19T17-05-25Z
      pullPolicy: IfNotPresent

    minio:
      licence: "Very-Secret-Licence-REPLACE_ME"
      tls: false

    workload:
      main:
        podSpec:
          containers:
            main:
              command:
                - minio
              args:
                - server
                - --certs-dir
                - /etc/minio/certs
              env:
                MINIO_ROOT_USER: "minio"
                MINIO_ROOT_PASSWORD: "CHANGE-ME-TO-A-LONG-PASSWORD"
                MINIO_VOLUMES: "/mnt/data"
                MINIO_CONSOLE_ADDRESS: ":9001"
                MINIO_LICENSE: "/minio.license"
              probes:
                startup:
                  type: '{{ ternary "https" "http" .Values.minio.tls }}'
                  path: /minio/health/live
                  port: 9000
                liveness:
                  type: '{{ ternary "https" "http" .Values.minio.tls }}'
                  path: /minio/health/live
                  port: 9000
                readiness:
                  type: '{{ ternary "https" "http" .Values.minio.tls }}'
                  path: /minio/health/live
                  port: 9000

    service:
      main:
        ports:
          main:
            port: 9000
      console:
        enabled: true
        ports:
          console:
            enabled: true
            port: 9001

    secret:
      license:
        enabled: true
        data:
          minio.license: "{{ .Values.minio.licence }}"

    persistence:
      data:
        enabled: true
        size: 20Gi
        mountPath: /mnt/data
      certs:
        enabled: true
        size: 1Gi
        mountPath: /etc/minio/certs
      license:
        enabled: true
        type: secret
        objectName: license
        mountPath: /minio.license
        subPath: minio.license