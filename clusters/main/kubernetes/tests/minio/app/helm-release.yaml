---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.23.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  
  values:
    image:
      repository: quay.io/minio/aistor/minio
      tag: RELEASE.2026-09-19T17-05-25Z
      pullPolicy: IfNotPresent

    minio:
      licence: "Very-Secret-Licence-REPLACE_ME"

    workload:
      main:
        podSpec:
          containers:
            main:
              command:
                - minio
              args:
                - server
                - /data
                - --address
                - ":10106"
                - --console-address
                - ":10107"
                - --certs-dir
                - /tmp/minio-certs
              env:
                MINIO_ROOT_USER: "minio"
                MINIO_ROOT_PASSWORD: "CHANGE-ME-TO-A-LONG-PASSWORD"
              probes:
                startup:
                  type: http
                  path: /minio/health/live
                  port: 10106
                liveness:
                  type: http
                  path: /minio/health/live
                  port: 10106
                readiness:
                  type: http
                  path: /minio/health/ready
                  port: 10106

    service:
      main:
        ports:
          main:
            port: 10107
      api:
        enabled: true
        ports:
          api:
            enabled: true
            port: 10106

    configmap:
      license:
        enabled: true
        data:
          minio.license: "{{ .Values.minio.licence }}"

    persistence:
      data:
        enabled: true
        size: 20Gi
        mountPath: /mnt/data
      certs:
        enabled: true
        size: 1Gi
        mountPath: /etc/minio/certs
      license:
        enabled: true
        type: configmap
        objectName: license
        mountPath: /minio.license
        subPath: minio.license