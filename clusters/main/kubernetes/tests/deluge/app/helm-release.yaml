---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deluge
  namespace: deluge
spec:
  interval: 1h
  chart:
    spec:
      chart: deluge
      version: 23.0.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:

    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: deluge.${BASE_DOMAIN}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare-staging