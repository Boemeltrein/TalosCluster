---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aistor
  namespace: aistor
spec:
  interval: 1h
  chart:
    spec:
      chart: aistor
      version: 1.0.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    minio:
      licence: "${MINIO_LICENCE}"
      rootUser: minio
      rootPassword: minio123
      browserRedirectUrl: https://minio.${BASE_DOMAIN}

    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: minio.${BASE_DOMAIN}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare
      api:
        enabled: true
        targetSelector:
          api: api
        ingressClassName: internal
        hosts:
          - host: minioapi.${BASE_DOMAIN}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare