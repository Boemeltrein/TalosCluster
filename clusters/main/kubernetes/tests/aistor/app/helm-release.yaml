---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aistor
  namespace: aistor
spec:
  interval: 15m
  chart:
    spec:
      chart: aistor
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  
  values:
    minio:
      # Without a valid license, AIStor starts in offline mode and blocks S3 operations.
      # Obtain a free license at https://www.min.io/pricing and encrypt it with SOPS.
      licence: "${MINIO_LICENCE}"
      # Use HTTPS for service protocols and health probes.
      # Enable when AIStor serves TLS using public.crt and private.key in /etc/minio/certs.
      # Leave false when TLS terminates at the ingress and AIStor serves HTTP.
      tls: false
      rootUser: minio
      rootPassword: minio123

    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: minio.${BASE_DOMAIN}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                MINIO_BROWSER_REDIRECT_URL: "https://minio.${BASE_DOMAIN}"