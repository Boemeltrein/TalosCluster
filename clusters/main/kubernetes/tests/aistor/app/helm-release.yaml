---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aistor
  namespace: aistor
spec:
  interval: 15m
  chart:
    spec:
      chart: aistor
      version: 1.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  
  values:
    minio:
      licence: "${MINIO_LICENCE}"
      rootUser: minio
      rootPassword: minio123
      browserRedirectUrl: https://minio.${BASE_DOMAIN}

    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: minio.${BASE_DOMAIN}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare
      api:
        enabled: true
        targetSelector:
          api: api
        ingressClassName: internal
        hosts:
          - host: minioapi.${BASE_DOMAIN}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare