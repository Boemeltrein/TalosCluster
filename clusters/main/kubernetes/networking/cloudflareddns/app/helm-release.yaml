---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflareddns
  namespace: cloudflareddns
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudflareddns
      version: 15.0.7
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                INTERVAL: 3600
                UPDATE_IPV6: false
                CF_APITOKEN: ${CLOUDFLARE_TOKEN}
                CF_HOSTS: "wireguard.${DOMAIN},echo.${DOMAIN},minecraft.${DOMAIN},hermitcraft.${DOMAIN}"
 
