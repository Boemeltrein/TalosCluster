---
# Read-only CloudNativePG visibility across all namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codex-cnpg-backup-reader
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - backups
      - scheduledbackups
      - clusters
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codex-cnpg-backup-reader
subjects:
  - kind: ServiceAccount
    name: codex-readonly
    namespace: codex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codex-cnpg-backup-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codex-gateway-readonly
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - grpcroutes
      - tcproutes
      - tlsroutes
      - udproutes
      - referencegrants
    verbs:
      - get
      - list

  - apiGroups:
      - gateway.envoyproxy.io
    resources:
      - envoyproxies
      - securitypolicies
      - backendtrafficpolicies
      - clienttrafficpolicies
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codex-gateway-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codex-gateway-readonly
subjects:
  - kind: ServiceAccount
    name: codex-readonly
    namespace: codex
---
# Read-only access to Tuppr upgrade configuration and status.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codex-tuppr-readonly
rules:
  - apiGroups:
      - tuppr.home-operations.com
    resources:
      - talosupgrades
      - kubernetesupgrades
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codex-tuppr-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codex-tuppr-readonly
subjects:
  - kind: ServiceAccount
    name: codex-readonly
    namespace: codex    
---
# Read-only access to Longhorn volume, engine, and replica status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-longhorn-readonly
  namespace: longhorn-system
rules:
  - apiGroups:
      - longhorn.io
    resources:
      - volumes
      - engines
      - replicas
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-longhorn-readonly
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-longhorn-readonly
subjects:
  - kind: ServiceAccount
    name: codex-readonly
    namespace: codex
---
# Read-only access to Speedtest Tracker VolSync backup and restore status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-volsync-readonly
  namespace: speedtest-tracker
rules:
  - apiGroups:
      - volsync.backube
    resources:
      - replicationsources
      - replicationdestinations
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-volsync-readonly
  namespace: speedtest-tracker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-volsync-readonly
subjects:
  - kind: ServiceAccount
    name: codex-readonly
    namespace: codex
---
# Allow GET requests to this Loki service through the Kubernetes API proxy.
# This grants access to stored logs from all namespaces, not just grafana-loki.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-loki-reader
  namespace: grafana-loki
rules:
  - apiGroups:
      - ""
    resources:
      - services/proxy
    resourceNames:
      - http:grafana-loki:3100
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-loki-reader
  namespace: grafana-loki
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-loki-reader
subjects:
  - kind: ServiceAccount
    name: codex-readonly
    namespace: codex
---
# Allow GET requests to the Prometheus API through the service proxy.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-prometheus-reader
  namespace: kube-prometheus-stack
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["http:kube-prometheus-stack-prometheus:9090"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-prometheus-reader
  namespace: kube-prometheus-stack
subjects:
  - kind: ServiceAccount
    name: codex-readonly
    namespace: codex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-prometheus-reader