---
# Read-only CloudNativePG visibility across all namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codex-cnpg-backup-reader
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - backups
      - scheduledbackups
      - clusters
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codex-cnpg-backup-reader
subjects:
  - kind: ServiceAccount
    name: codex-readonly
    namespace: codex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codex-cnpg-backup-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codex-gateway-readonly
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - grpcroutes
      - tcproutes
      - tlsroutes
      - udproutes
      - referencegrants
    verbs:
      - get
      - list

  - apiGroups:
      - gateway.envoyproxy.io
    resources:
      - envoyproxies
      - securitypolicies
      - backendtrafficpolicies
      - clienttrafficpolicies
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codex-gateway-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codex-gateway-readonly
subjects:
  - kind: ServiceAccount
    name: codex-readonly
    namespace: codex
---
# Read-only access to Tuppr upgrade configuration and status.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codex-tuppr-readonly
rules:
  - apiGroups:
      - tuppr.home-operations.com
    resources:
      - talosupgrades
      - kubernetesupgrades
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codex-tuppr-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codex-tuppr-readonly
subjects:
  - kind: ServiceAccount
    name: codex-readonly
    namespace: codex    
---
# Read-only access to Longhorn volume, engine, and replica status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-longhorn-readonly
  namespace: longhorn-system
rules:
  - apiGroups:
      - longhorn.io
    resources:
      - volumes
      - engines
      - replicas
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-longhorn-readonly
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-longhorn-readonly
subjects:
  - kind: ServiceAccount
    name: codex-readonly
    namespace: codex