---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: server-temperature-monitoring
  namespace: grafana-operator
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prometheus
  folder: "Infrastructure ⚙️"
  json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "Bestaande Prometheus-datasource met TrueNAS- en IPMI-metrics.",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "id": null,
      "uid": "server-temperature-monitoring",
      "title": "Server - Temperature Monitoring",
      "description": "Herbouwd uit de eerdere queries en screenshots: CPU-temperatuur, moving average, vierdegraads trendlijn en fan-RPM op een tweede Y-as. Beheerd vanuit Git met Flux en Grafana Operator. De JSON is standaard niet bewerkbaar in de UI om onopgeslagen Git-wijzigingen te voorkomen. De CPU-bron is de TrueNAS-exporter, de fan-bron de IPMI-exporter.",
      "tags": [
        "truenas",
        "temperature",
        "fans",
        "ipmi"
      ],
      "timezone": "browser",
      "editable": false,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "title": "CPU Temperature & Fan RPM",
          "description": "Links: CPU-temperatuur (°C). Rechts: ventilatorsnelheid (RPM). De CPU-query groepeert op exported_instance en cpu zodat podnamen de lijn niet splitsen. Moving Average (5m) is het rekenkundige gemiddelde van beschikbare ruwe samples in de voorafgaande vijf minuten. Trend (4e graad) is een regressie over de getoonde CPU-datapunten, geen voorspelling. De waarschuwingslijnen 70/80/85 °C zijn jouw gekozen dashboardgrenzen, geen fabrikantlimieten. Lange tijdvakken kunnen in de grafiek een lagere resolutie hebben; de CPU Min/Max-tegels gebruiken ruwe samples. Afwezigheid van metingen wordt niet als nul weergegeven.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "maxDataPoints": 3000,
          "interval": "30s",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "celsius",
              "decimals": 1,
              "mappings": [],
              "noValue": "Geen data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 0,
                "gradientMode": "none",
                "spanNulls": false,
                "insertNulls": false,
                "showPoints": "never",
                "pointSize": 4,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisPlacement": "left",
                "axisLabel": "Temperatuur (°C)",
                "axisColorMode": "text",
                "axisBorderShow": false,
                "axisGridShow": true,
                "axisSoftMin": 60,
                "scaleDistribution": {
                  "type": "linear"
                },
                "axisCenteredZero": false,
                "hideFrom": {
                  "tooltip": false,
                  "viz": false,
                  "legend": false
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "A"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#73BF69"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 1
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 70
                        },
                        {
                          "color": "orange",
                          "value": 80
                        },
                        {
                          "color": "red",
                          "value": 85
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.thresholdsStyle",
                    "value": {
                      "mode": "dashed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#B877D9"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 3
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*(?:[Rr]egression|[Rr]egressie).*CPU Temperature.*|CPU Temperature predicted"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Trend (4e graad)"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#5794F2"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  },
                  {
                    "id": "custom.thresholdsStyle",
                    "value": {
                      "mode": "off"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "C"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "rotrpm"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "custom.axisLabel",
                    "value": "Ventilatoren (RPM)"
                  },
                  {
                    "id": "custom.axisSoftMin",
                    "value": 0
                  },
                  {
                    "id": "custom.axisSoftMax",
                    "value": 2500
                  },
                  {
                    "id": "custom.axisGridShow",
                    "value": false
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.thresholdsStyle",
                    "value": {
                      "mode": "off"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 1.5
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        6,
                        4
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "FAN1_1"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#CCCCDC"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "FAN2_1"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#56D2D2"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (exported_instance, cpu) (\n  cpu_temperature{job=\"truenas-exporter\", exported_instance=\"${truenas_host}\", cpu=\"cpucpu\"}\n)",
              "format": "time_series",
              "instant": false,
              "range": true,
              "legendFormat": "CPU Temperature",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (exported_instance, cpu) (\n  sum_over_time(cpu_temperature{job=\"truenas-exporter\", exported_instance=\"${truenas_host}\", cpu=\"cpucpu\"}[5m])\n)\n/\nsum by (exported_instance, cpu) (\n  count_over_time(cpu_temperature{job=\"truenas-exporter\", exported_instance=\"${truenas_host}\", cpu=\"cpucpu\"}[5m])\n)",
              "format": "time_series",
              "instant": false,
              "range": true,
              "legendFormat": "Moving Average (5m)",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "ipmi_fan_speed_rpm{job=\"ipmi-exporter\", instance=\"${bmc_ip}\"}",
              "format": "time_series",
              "instant": false,
              "range": true,
              "legendFormat": "{{name}}",
              "refId": "C"
            }
          ],
          "transformations": [
            {
              "id": "regression",
              "options": {
                "modelType": "polynomial",
                "degree": 4,
                "xFieldName": "Time",
                "yFieldName": "CPU Temperature",
                "predictionCount": 160
              }
            }
          ]
        },
        {
          "id": 2,
          "title": "CPU Min",
          "description": "Laagste opgeslagen CPU-temperatuur in de geselecteerde periode, over alle exporter-pods. Berekend met min_over_time, onafhankelijk van de paneelbreedte.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "unit": "celsius",
              "mappings": [],
              "noValue": "Geen data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "min by (exported_instance, cpu) (\n  min_over_time(cpu_temperature{job=\"truenas-exporter\", exported_instance=\"${truenas_host}\", cpu=\"cpucpu\"}[$__range])\n)",
              "format": "time_series",
              "instant": true,
              "range": false,
              "legendFormat": "CPU Min",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "CPU Avg",
          "description": "Rekenkundig gemiddelde van alle beschikbare ruwe CPU-samples in de geselecteerde periode. Som van de metingen gedeeld door het aantal metingen; geen gemiddelde van podgemiddelden. Ontbrekende metingen tellen niet mee. Bij tijdelijk overlappende exporters tellen hun samples allebei mee.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "unit": "celsius",
              "mappings": [],
              "noValue": "Geen data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (exported_instance, cpu) (\n  sum_over_time(cpu_temperature{job=\"truenas-exporter\", exported_instance=\"${truenas_host}\", cpu=\"cpucpu\"}[$__range])\n)\n/\nsum by (exported_instance, cpu) (\n  count_over_time(cpu_temperature{job=\"truenas-exporter\", exported_instance=\"${truenas_host}\", cpu=\"cpucpu\"}[$__range])\n)",
              "format": "time_series",
              "instant": true,
              "range": false,
              "legendFormat": "CPU Avg",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "CPU Max",
          "description": "Hoogste opgeslagen CPU-temperatuur in de geselecteerde periode, over alle exporter-pods. Berekend met max_over_time, niet met Max over een geresamplede grafiek. Kan hoger zijn dan de zichtbare grafiekpiek als de grafiek minder punten ophaalt.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "unit": "celsius",
              "mappings": [],
              "noValue": "Geen data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (exported_instance, cpu) (\n  max_over_time(cpu_temperature{job=\"truenas-exporter\", exported_instance=\"${truenas_host}\", cpu=\"cpucpu\"}[$__range])\n)",
              "format": "time_series",
              "instant": true,
              "range": false,
              "legendFormat": "CPU Max",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "CPU Last",
          "description": "CPU-temperatuur bij het einde van het geselecteerde tijdvak, via een Instant-query. Bij een historisch tijdvak is dit dus niet de temperatuur van nu. Prometheus gebruikt alleen een recente, niet-stale meting binnen zijn lookback. Bij ontbrekende data rond die eindtijd blijft deze tegel leeg; er wordt geen oude podwaarde geforceerd.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "unit": "celsius",
              "mappings": [],
              "noValue": "Geen data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (exported_instance, cpu) (\n  cpu_temperature{job=\"truenas-exporter\", exported_instance=\"${truenas_host}\", cpu=\"cpucpu\"}\n)",
              "format": "time_series",
              "instant": true,
              "range": false,
              "legendFormat": "CPU Last",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "FAN1_1 · Last",
          "description": "Laatst beschikbare toerental rond het einde van het geselecteerde tijdvak. Bij een historisch tijdvak is dit een historische waarde. Geen vaste alarmgrenzen ingesteld: de naam uit IPMI zegt nog niet welke fysieke ventilator dit is.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "#CCCCDC"
              },
              "decimals": 0,
              "unit": "rotrpm",
              "mappings": [],
              "noValue": "Geen data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "ipmi_fan_speed_rpm{job=\"ipmi-exporter\", instance=\"${bmc_ip}\", name=\"FAN1_1\"}",
              "format": "time_series",
              "instant": true,
              "range": false,
              "legendFormat": "FAN1_1 · Last",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "FAN2_1 · Last",
          "description": "Laatst beschikbare toerental rond het einde van het geselecteerde tijdvak. Bij een historisch tijdvak is dit een historische waarde. Geen vaste alarmgrenzen ingesteld: de naam uit IPMI zegt nog niet welke fysieke ventilator dit is.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "#56D2D2"
              },
              "decimals": 0,
              "unit": "rotrpm",
              "mappings": [],
              "noValue": "Geen data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "ipmi_fan_speed_rpm{job=\"ipmi-exporter\", instance=\"${bmc_ip}\", name=\"FAN2_1\"}",
              "format": "time_series",
              "instant": true,
              "range": false,
              "legendFormat": "FAN2_1 · Last",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "1m",
      "schemaVersion": 41,
      "version": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h"
        ]
      },
      "templating": {
        "list": [
          {
            "name": "truenas_host",
            "label": "TrueNAS host",
            "description": "Waarde van exported_instance bij cpu_temperature.",
            "type": "textbox",
            "hide": 0,
            "query": "truenas",
            "current": {
              "text": "truenas",
              "value": "truenas"
            },
            "options": [
              {
                "text": "truenas",
                "value": "truenas",
                "selected": true
              }
            ],
            "skipUrlSync": false
          },
          {
            "name": "bmc_ip",
            "label": "BMC IP",
            "description": "Waarde van instance bij ipmi_fan_speed_rpm.",
            "type": "textbox",
            "hide": 0,
            "query": "192.168.1.10",
            "current": {
              "text": "192.168.1.10",
              "value": "192.168.1.10"
            },
            "options": [
              {
                "text": "192.168.1.10",
                "value": "192.168.1.10",
                "selected": true
              }
            ],
            "skipUrlSync": false
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
