---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ext-denon
  namespace: external-services
spec:
  interval: 1h
  chart:
    spec:
      chart: external-service
      version: 18.0.6
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    service:
      main:
        type: ExternalIP
        externalIP: "192.168.1.30"
        useSlice: true
        ports:
          main:
            protocol: http
            port: 80

    route:
      main:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - denon.${DOMAIN}

