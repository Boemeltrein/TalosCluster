---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librespeed
  namespace: librespeed
spec:
  interval: 1h
  chart:
    spec:
      chart: librespeed
      version: 19.0.7
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    route:
      main:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            # sectionName: https
        hostnames: 
          - libretest.${DOMAIN}

    resources:
      requests:
        cpu: 10m
        
    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true