---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm
  namespace: romm
spec:
  interval: 15m
  chart:
    spec:
      chart: romm
      version: 19.4.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Amsterdam

    securityContext:
      container:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
      pod:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                ROMM_AUTH_SECRET_KEY: "${ROMM_AUTH_SECRET_KEY}"
                HASHEOUS_API_ENABLED: true

    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: romm.${BASE_DOMAIN}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: blaze
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      assets:
        volsync:
          - name: assets
            type: restic
            credentials: blaze
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      resources:
        volsync:
          - name: resources
            type: restic
            credentials: blaze
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      library:
        enabled: true
        type: nfs
        server: 192.168.1.50
        path: /mnt/HDD_Cluster/Romms
        mountPath: /romm/library
      uploads:
        enabled: true
        type: emptyDir
        mountPath: /romm/tmp
      nginx-conf:
        enabled: true
        type: emptyDir        
        mountPath: /etc/nginx/conf.d

    cnpg:
      main:
        cluster:
          singleNode: true
        mode: recovery   # Set to 'recovery' when recovery from S3, also change the revisions
        backups:
          enabled: true
          credentials: blaze
          retentionPolicy: "14d"
          # revision: "2"
        recovery:
          credentials: blaze
          # revision: "1"
        monitoring:
          enablePodMonitor: true