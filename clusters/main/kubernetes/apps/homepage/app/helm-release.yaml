---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: 14.3.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    # Legacy Ingress configuration retained temporarily for reference.
    # ingress:
    #   main:
    #     enabled: true
    #     ingressClassName: internal
    #     hosts:
    #       - host: homepage.${BASE_DOMAIN}
    #     integrations:
    #       certManager:
    #         enabled: true
    #         certificateIssuer: cloudflare

    route:
      main:
        enabled: true
        primary: true
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - homepage.${DOMAIN}
      codeserver:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - cs-homepage.${DOMAIN}
        rules:
          - backendRefs:
              - name: homepage-codeserver
                port: 12321

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true

    addons:
      codeserver:
        enabled: true
        # Legacy Ingress configuration retained temporarily for reference.
        # ingress:
        #   enabled: true
        #   ingressClassName: internal
        #   hosts:
        #     - host: cs-homepage.${BASE_DOMAIN}
        #   integrations:
        #     certManager:
        #       enabled: true
        #       certificateIssuer: cloudflare

    workload:
      main:
        podSpec:
          automountServiceAccountToken: true
          containers:
            main:
              env:
                HOMEPAGE_ALLOWED_HOSTS: "homepage.${DOMAIN}"

    resources:
      requests:
        cpu: 10m

