---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  interval: 1h
  chart:
    spec:
      chart: prowlarr
      version: 23.0.6
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PROWLARR__SERVER__TRUSTEDNETWORKS: "172.16.0.0/16"     
     
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: prowlarr.${BASE_DOMAIN}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare
          homepage:
            enabled: true
            group: "Arr"
            weight: 3
            widget:
              custom:
                key: "${HP_API_PROWLARR}"

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true

    resources:
      requests:
        cpu: 10m

    configmap:
      dashboard:
        enabled: false