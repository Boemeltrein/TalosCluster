---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  interval: 1h
  chart:
    spec:
      chart: prowlarr
      version: 23.1.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PROWLARR__SERVER__TRUSTEDNETWORKS: "172.16.0.0/16"     
     
    route:
      main:
        enabled: true
        annotations:
          gethomepage.dev/description: Indexer manager/proxy built on the popular arr net base stack to integrate with your various
            PVR apps.
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Arr
          gethomepage.dev/href: https://prowlarr.${DOMAIN}/
          gethomepage.dev/icon: https://truecharts.org/img/hotlink-ok/chart-icons/prowlarr.webp
          gethomepage.dev/name: Prowlarr
          gethomepage.dev/pod-selector: app.kubernetes.io/instance=prowlarr,pod.lifecycle in (permanent)
          gethomepage.dev/weight: '3'
          gethomepage.dev/widget.key: ${HP_API_PROWLARR}
          gethomepage.dev/widget.type: prowlarr
          gethomepage.dev/widget.url: http://prowlarr.prowlarr.svc:9696
          gethomepage.dev/widget.version: '1'
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - prowlarr.${DOMAIN}

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true

    resources:
      requests:
        cpu: 10m

    configmap:
      dashboard:
        enabled: false
