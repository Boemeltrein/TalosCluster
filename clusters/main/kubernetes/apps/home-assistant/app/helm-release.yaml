---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 1h
  chart:
    spec:
      chart: home-assistant
      version: 32.0.10
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    route:
      main:
        enabled: true
        annotations:
          gethomepage.dev/description: Open source home automation that puts local control and privacy first.
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Network
          gethomepage.dev/href: https://homeassistant.${DOMAIN}/
          gethomepage.dev/icon: https://truecharts.org/img/hotlink-ok/chart-icons/home-assistant.webp
          gethomepage.dev/name: HomeAssistant
          gethomepage.dev/pod-selector: app.kubernetes.io/instance=home-assistant,pod.lifecycle in (permanent)
          gethomepage.dev/widget.key: ${HP_API_HASS}
          gethomepage.dev/widget.type: homeassistant
          gethomepage.dev/widget.url: http://home-assistant.home-assistant.svc:8123
          gethomepage.dev/widget.version: '1'
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - homeassistant.${DOMAIN}

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      p1meter:
        enabled: true
        type: device
        hostPath: /dev/serial/by-id/usb-FTDI_P1_Converter_Cable_A6X1Y2R3-if00-port0

    cnpg:
      main:
        cluster:
          singleNode: true
        mode: recovery # Set to 'recovery' when recovery from S3, also change the revisions
        backups:
          enabled: true
          credentials: rustfs
          retentionPolicy: "14d"
          # revision: "4"
        recovery:
          credentials: rustfs
          # revision: "3"
        monitoring:
          enablePodMonitor: true
