---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: radarr
spec:
  interval: 1h
  chart:
    spec:
      chart: radarr
      version: 29.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                RADARR__SERVER__TRUSTEDNETWORKS: "172.16.0.0/16"    

    route:
      main:
        enabled: true
        annotations:
          gatus.home-operations.com/enabled: 'true'
          gethomepage.dev/description: A fork of Sonarr to work with movies à la Couchpotato
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Arr
          gethomepage.dev/href: https://radarr.${DOMAIN}/
          gethomepage.dev/icon: https://truecharts.org/img/hotlink-ok/chart-icons/radarr.webp
          gethomepage.dev/name: Radarr
          gethomepage.dev/pod-selector: app.kubernetes.io/instance=radarr,pod.lifecycle in (permanent)
          gethomepage.dev/weight: '2'
          gethomepage.dev/widget.key: ${HP_API_RADARR}
          gethomepage.dev/widget.type: radarr
          gethomepage.dev/widget.url: http://radarr.radarr.svc:7878
          gethomepage.dev/widget.version: '1'
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - radarr.${DOMAIN}

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      downloads:
        enabled: true
        type: nfs
        server: 192.168.1.50
        path: /mnt/HDD_Cluster/Usenet
        mountPath: /data/usenet
      videos:
        enabled: true
        type: nfs
        server: 192.168.1.50
        path: /mnt/HDD_Cluster/Videos
        mountPath: /data/videos

    resources:
      requests:
        cpu: 10m
