---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zwave-js-ui
  namespace: zwave-js-ui
spec:
  interval: 15m
  chart:
    spec:
      chart: zwavejs2mqtt
      version: 25.15.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    credentials:
      minio:
        type: s3
        url: "http://${S3_URL}"
        bucket: "${S3_BUCKET}-zwave-js-ui"
        accessKey: "${S3_ACCESKEY}"
        secretKey: "${S3_SECRETKEY}"
        encrKey: "${S3_ENCRKEY}"
      blaze:
        type: s3
        url: "https://${S3_BLAZE_URL}"
        bucket: "${S3_BLAZE_BUCKET}"
        accessKey: "${S3_BLAZE_ACCESKEY}"
        secretKey: "${S3_BLAZE_SECRETKEY}"
        encrKey: "${S3_BLAZE_ENCRKEY}"

    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: zwave.${BASE_DOMAIN}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: blaze
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      zwave:
        enabled: true
        type: device
        hostPath: /dev/serial/by-id/usb-0658_0200-if00

    resources:
      requests:
        cpu: 10m