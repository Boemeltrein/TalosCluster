---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zwave-js-ui
  namespace: zwave-js-ui
spec:
  interval: 1h
  chart:
    spec:
      chart: zwavejs2mqtt
      version: 26.1.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    route:
      main:
        enabled: true
        annotations:
          gatus.home-operations.com/enabled: 'true'
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - zwave.${DOMAIN}

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      zwave:
        enabled: true
        type: device
        hostPath: /dev/serial/by-id/usb-0658_0200-if00

    resources:
      requests:
        cpu: 10m
