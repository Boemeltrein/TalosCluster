---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: sonarr
spec:
  interval: 1h
  chart:
    spec:
      chart: sonarr
      version: 28.0.14
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                SONARR__SERVER__TRUSTEDNETWORKS: "172.16.0.0/16"          
            exportarr:
              env:
                ENABLE_ADDITIONAL_METRICS: true

    # Legacy Ingress configuration retained temporarily for reference.
    # ingress:
    #   main:
    #     enabled: true
    #     ingressClassName: internal
    #     hosts:
    #       - host: sonarr.${BASE_DOMAIN}         
    #     integrations:
    #       certManager:
    #         enabled: true
    #         certificateIssuer: cloudflare
    #       homepage:
    #         enabled: true
    #         group: "Arr"
    #         weight: 1
    #         widget:
    #           custom:
    #             key: "${HP_API_SONARR}"

    route:
      main:
        enabled: true
        annotations:
          gethomepage.dev/description: Smart PVR for newsgroup and bittorrent users
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Arr
          gethomepage.dev/href: https://sonarr.${DOMAIN}/
          gethomepage.dev/icon: https://truecharts.org/img/hotlink-ok/chart-icons/sonarr.webp
          gethomepage.dev/name: Sonarr
          gethomepage.dev/pod-selector: app.kubernetes.io/instance=sonarr,pod.lifecycle in (permanent)
          gethomepage.dev/weight: '1'
          gethomepage.dev/widget.key: ${HP_API_SONARR}
          gethomepage.dev/widget.type: sonarr
          gethomepage.dev/widget.url: http://sonarr.sonarr.svc:8989
          gethomepage.dev/widget.version: '1'
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - sonarr.${DOMAIN}

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      downloads:
        enabled: true
        type: nfs
        server: 192.168.1.50
        path: /mnt/HDD_Cluster/Usenet
        mountPath: /data/usenet
      videos:
        enabled: true
        type: nfs
        server: 192.168.1.50
        path: /mnt/HDD_Cluster/Videos
        mountPath: /data/videos

    resources:
      requests:
        cpu: 10m

