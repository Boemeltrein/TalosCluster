---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: it-tools
  namespace: it-tools
spec:
  interval: 1h
  chart:
    spec:
      chart: it-tools
      version: 10.0.11
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    route:
      main:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - it-tools.${DOMAIN}

