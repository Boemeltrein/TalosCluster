---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
  namespace: bazarr
spec:
  interval: 1h
  chart:
    spec:
      chart: bazarr
      version: 25.0.7
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    route:
      main:
        enabled: true
        annotations:
          gethomepage.dev/description: Bazarr is a companion application to Sonarr and Radarr. It manages and downloads subtitles
            based on your requirements
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Arr
          gethomepage.dev/href: https://bazarr.${DOMAIN}/
          gethomepage.dev/icon: https://truecharts.org/img/hotlink-ok/chart-icons/bazarr.webp
          gethomepage.dev/name: Bazarr
          gethomepage.dev/pod-selector: app.kubernetes.io/instance=bazarr,pod.lifecycle in (permanent)
          gethomepage.dev/weight: '5'
          gethomepage.dev/widget.key: ${HP_API_BAZARR}
          gethomepage.dev/widget.type: bazarr
          gethomepage.dev/widget.url: http://bazarr.bazarr.svc:6767
          gethomepage.dev/widget.version: '1'
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - bazarr.${DOMAIN}

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      videos:
        enabled: true
        type: nfs
        server: 192.168.1.50
        path: /mnt/HDD_Cluster/Videos
        mountPath: /data/videos

    resources:
      requests:
        cpu: 10m
        
