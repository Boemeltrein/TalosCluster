---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: test-runner
  namespace: actions-runner-system
spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-system
        namespace: flux-system
  values:
    githubConfigUrl: https://github.com/Boemeltrein/TalosCluster
    githubConfigSecret: test-runner-secret
    minRunners: 1
    maxRunners: 10

    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    
    containerMode:
      type: dind
      # type: kubernetes
      # kubernetesModeWorkVolumeClaim:
      #   accessModes: 
      #     - ReadWriteOnce
      #   storageClassName: "openebs-hostpath"
      #   resources:
      #     requests:
      #       storage: 5Gi

    template:
      spec:
        automountServiceAccountToken: false
        containers:
          - name: runner
            image:  ghcr.io/home-operations/actions-runner:2.338.2@sha256:2dd7caa094a425c041539447cb0e6ae63cda10b5242773764683b695b8fa5613
            command:
              - /home/runner/run.sh
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: NODE
        #         valueFrom:
        #           fieldRef:
        #             fieldPath: status.hostIP
        #     volumeMounts:
        #       - mountPath: /var/run/secrets/talos.dev
        #         name: talos
        #         readOnly: true
        # serviceAccountName: test-runner            
        # volumes:
        #   - name: talos
        #     secret:
        #       secretName: test-runner