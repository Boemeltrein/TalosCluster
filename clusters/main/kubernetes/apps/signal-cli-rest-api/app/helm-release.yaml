---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: signal-cli-rest-api
  namespace: signal-cli-rest-api
spec:
  interval: 1h
  chart:
    spec:
      chart: signal-cli-rest-api
      version: 3.0.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    service:
      main:
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |
            group: services
            interval: 60s
            ui:
              hide-url: true
              hide-hostname: true
            conditions:
              - "[CONNECTED] == true"
              - "[RESPONSE_TIME] < 100"
            alerts:
              - type: discord

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                AUTO_RECEIVE_SCHEDULE: 0 4 * * *

    route:
      main:
        enabled: true
        annotations:
          gatus.home-operations.com/enabled: 'true'
          gatus.home-operations.com/endpoint: |
            conditions:
              - '[STATUS] == 404'
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - signalapi.${DOMAIN}

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true

