---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: sabnzbd
spec:
  interval: 1h
  chart:
    spec:
      chart: sabnzbd
      version: 26.0.6
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                SABNZBD__HOST_WHITELIST_ENTRIES: "sabnzbd.${DOMAIN}, sabnzbd.sabnzbd.svc, sabnzbd"
            exportarr:
              env:
                ENABLE_ADDITIONAL_METRICS: true

    # Legacy Ingress configuration retained temporarily for reference.
    # ingress:
    #   main:
    #     enabled: true
    #     ingressClassName: internal
    #     hosts:
    #       - host: sabnzbd.${BASE_DOMAIN}
    #     integrations:
    #       certManager:
    #         enabled: true
    #         certificateIssuer: cloudflare
    #       homepage:
    #         enabled: true
    #         group: "Arr"
    #         weight: 4
    #         widget:
    #           custom:
    #             key: "${HP_API_SABNZBD}"

    route:
      main:
        enabled: true
        annotations:
          gethomepage.dev/description: Free and easy binary newsreader
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Arr
          gethomepage.dev/href: https://sabnzbd.${DOMAIN}/
          gethomepage.dev/icon: https://truecharts.org/img/hotlink-ok/chart-icons/sabnzbd.webp
          gethomepage.dev/name: Sabnzbd
          gethomepage.dev/pod-selector: app.kubernetes.io/instance=sabnzbd,pod.lifecycle in (permanent)
          gethomepage.dev/weight: '4'
          gethomepage.dev/widget.key: ${HP_API_SABNZBD}
          gethomepage.dev/widget.type: sabnzbd
          gethomepage.dev/widget.url: http://sabnzbd.sabnzbd.svc:10097
          gethomepage.dev/widget.version: '1'
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - sabnzbd.${DOMAIN}

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      downloads:
        enabled: true
        type: nfs
        server: 192.168.1.50
        path: /mnt/HDD_Cluster/Usenet
        mountPath: /data/usenet

    metrics:
      main:
        enabled: true
        apiKey: ${HP_API_SABNZBD}
        prometheusRule:
          enabled: false

    resources:
      limits:
        cpu: 4000m
        memory: 8Gi
      requests:
        cpu: 1000m
        memory: 2Gi 

