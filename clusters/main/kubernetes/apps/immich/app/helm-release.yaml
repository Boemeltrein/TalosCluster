---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 1h
  chart:
    spec:
      chart: immich
      version: 35.0.25
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    # Legacy Ingress configuration retained temporarily for reference.
    # ingress:
    #   main:
    #     enabled: true
    #     ingressClassName: internal
    #     hosts:
    #       - host: immich.${BASE_DOMAIN}
    #     integrations:
    #       certManager:
    #         enabled: true
    #         certificateIssuer: cloudflare
    #       homepage:
    #         enabled: true
    #         group: "Media"
    #         widget:
    #           custom:
    #             key: "${HP_API_IMMICH}"
    #             version: "2"

    route:
      main:
        enabled: true
        annotations:
          gethomepage.dev/description: High performance self-hosted photo and video backup solution.
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Media
          gethomepage.dev/href: https://immich.${DOMAIN}/
          gethomepage.dev/icon: https://truecharts.org/img/hotlink-ok/chart-icons/immich.webp
          gethomepage.dev/name: Immich
          gethomepage.dev/pod-selector: app.kubernetes.io/instance=immich,pod.lifecycle in (permanent)
          gethomepage.dev/widget.key: ${HP_API_IMMICH}
          gethomepage.dev/widget.type: immich
          gethomepage.dev/widget.url: http://immich.immich.svc:10323
          gethomepage.dev/widget.version: '2'
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - immich.${DOMAIN}

    persistence:
      library:
        type: nfs
        server: 192.168.1.50
        path: /mnt/SSD_Cluster/app_immich/library
      uploads:
        type: nfs
        server: 192.168.1.50
        path: /mnt/SSD_Cluster/app_immich/uploads
      backups:
        type: nfs
        server: 192.168.1.50
        path: /mnt/SSD_Cluster/app_immich/backups
      thumbs:
        type: nfs
        server: 192.168.1.50
        path: /mnt/SSD_Cluster/app_immich/thumbs
      profile:
        type: nfs
        server: 192.168.1.50
        path: /mnt/SSD_Cluster/app_immich/profile
      video:
        type: nfs
        server: 192.168.1.50
        path: /mnt/SSD_Cluster/app_immich/encoded-video
      afbeeldingen:
        enabled: true
        type: nfs
        server: 192.168.1.50
        path: /mnt/HDD_Cluster/Afbeeldingen
        mountPath: /mnt/afbeeldingen
        readOnly: true
        targetSelector:
          main:
            main: {}
          microservices:
            microservices: {}

    cnpg:
      main:
        cluster:
          singleNode: true
        mode: recovery   # Set to 'recovery' when recovery from S3, also change the revisions
        backups:
          enabled: true
          credentials: rustfs
          retentionPolicy: "14d"
          # revision: "1"
        recovery:
          credentials: rustfs
          # revision: ""
        monitoring:
          enablePodMonitor: true          
