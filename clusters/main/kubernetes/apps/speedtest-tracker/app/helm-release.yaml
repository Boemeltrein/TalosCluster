---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speedtest-tracker
  namespace: speedtest-tracker
spec:
  interval: 1h
  chart:
    spec:
      chart: speedtest-tracker
      version: 13.0.12
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PUBLIC_DASHBOARD: false
                CHART_DATETIME_FORMAT: "d.m H:i"
                DATETIME_FORMAT: "d.m.Y H:i"
                SPEEDTEST_SCHEDULE: "0 * * * *"
                PRUNE_RESULTS_OLDER_THAN: 90
                DISPLAY_TIMEZONE: "Europe/Amsterdam"
                SPEEDTEST_SERVERS: "52857"

    route:
      main:
        enabled: true
        annotations:
          gatus.home-operations.com/enabled: 'true'
          gethomepage.dev/description: Speedtest Tracker is a self-hosted internet performance tracking application that runs
            speedtest checks against Ookla's Speedtest service.
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Network
          gethomepage.dev/href: https://speedtest-tracker.${DOMAIN}/
          gethomepage.dev/icon: https://truecharts.org/img/hotlink-ok/chart-icons/speedtest-tracker.webp
          gethomepage.dev/name: SpeedtestTracker
          gethomepage.dev/pod-selector: app.kubernetes.io/instance=speedtest-tracker,pod.lifecycle in (permanent)
          gethomepage.dev/widget.type: speedtest
          gethomepage.dev/widget.url: http://speedtest-tracker.speedtest-tracker.svc:9004
          gethomepage.dev/widget.version: '1'
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
        hostnames:
          - speedtest-tracker.${DOMAIN}

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: aistor
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true

    cnpg:
      main:
        cluster:
          singleNode: true
        mode: recovery   # Set to 'recovery' when recovery from S3, also change the revisions
        backups:
          enabled: true
          credentials: aistor
          retentionPolicy: "14d"
          # revision: "5"
        recovery:
          credentials: aistor
          # revision: "4"
        monitoring:
          enablePodMonitor: true

    resources:
      requests:
        cpu: 10m


