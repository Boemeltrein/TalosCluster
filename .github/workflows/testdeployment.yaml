---
name: HelmRelease test deployment

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          install_args: >-
            jq
            yq

      - name: Detect changed HelmReleases
        id: set
        run: |
          changed_files=$(git diff \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}" \
            --name-only)

          files="$({
            printf '%s\n' "$changed_files" \
              | grep 'helm-release.yaml$' || true

            while IFS= read -r source_file; do
              [ -f "$source_file" ] || continue

              source_name=$(yq -r '.metadata.name // ""' "$source_file")
              source_namespace=$(yq -r '.metadata.namespace // "default"' "$source_file")

              while IFS= read -r helmrelease; do
                if SOURCE_NAME="$source_name" SOURCE_NAMESPACE="$source_namespace" \
                  yq -e '
                    .spec.chartRef.kind == "OCIRepository" and
                    .spec.chartRef.name == strenv(SOURCE_NAME) and
                    (.spec.chartRef.namespace // .metadata.namespace // "default") == strenv(SOURCE_NAMESPACE)
                  ' "$helmrelease" >/dev/null 2>&1; then
                  echo "$helmrelease"
                fi
              done < <(find clusters/main/kubernetes -type f -name 'helm-release.yaml')
            done < <(
              printf '%s\n' "$changed_files" \
                | grep '^repositories/oci/.*\.yaml$' || true
            )
          } | sort -u)"
          
          if [ -z "$files" ]; then
            echo "🔍 No HelmReleases changed"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "🔍 Detected HelmReleases:"
          printf '%s\n' "$files"

          # --------------------------------------------------
          # Filter releases using YAML skip list
          # --------------------------------------------------

          mapfile -t files_array <<< "$files"

          filtered=()
          skipped=()

          SKIP_FILE="ci/.config.yaml"

          if [ -f "$SKIP_FILE" ]; then
            mapfile -t skip_list < <(yq -r '.skipList[]' "$SKIP_FILE")
          else
            skip_list=()
          fi

          for file in "${files_array[@]}"; do
            dir=$(dirname "$file")
            skip=false

            for skip_entry in "${skip_list[@]}"; do
              if [ "$dir" = "$skip_entry" ]; then
                skip=true
                break
              fi
            done

            if [ "$skip" = true ]; then
              skipped+=("$file")
            else
              filtered+=("$file")
            fi
          done

          echo ""
          echo "===== HelmRelease CI scan result ====="

          if [ ${#skipped[@]} -gt 0 ]; then
            echo "⏭️ Skipped:"
            printf '  - %s\n' "${skipped[@]}"
          else
            echo "⏭️ Skipped: none"
          fi

          if [ ${#filtered[@]} -gt 0 ]; then
            echo "🧪 To test:"
            printf '  - %s\n' "${filtered[@]}"
          else
            echo "🧪 To test: none"
          fi
          echo "======================================"
          echo ""

          # ---------- GitHub job summary ----------
          {
            echo "## HelmRelease CI result"
            echo ""
            echo "### ⏭️ Skipped"
            if [ ${#skipped[@]} -gt 0 ]; then
              printf -- "- %s\n" "${skipped[@]}"
            else
              echo "_none_"
            fi
            echo ""
            echo "### 🧪 To test"
            if [ ${#filtered[@]} -gt 0 ]; then
              printf -- "- %s\n" "${filtered[@]}"
            else
              echo "_none_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # ---------- Matrix handling ----------
          if [ ${#filtered[@]} -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json=$(printf '%s\n' "${filtered[@]}" | jq -R . | jq -s .)

          {
            echo "matrix<<EOF"
            echo "$json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        helmrelease: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      # --------------------------------------------------
      # Checkout repo
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --------------------------------------------------
      # Setup required CLI tools
      # --------------------------------------------------
      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          install_args: >-
            helm
            jq
            kubectl
            yq

      # --------------------------------------------------
      # Dummy env vars for Helm interpolation
      # --------------------------------------------------
      - name: Load dummy env vars from config
        run: |
          yq e '.dummyEnv | to_entries | .[] | "\(.key)=\(.value)"' ci/.config.yaml >> $GITHUB_ENV
          
      # --------------------------------------------------
      # Create ephemeral k3d cluster
      # --------------------------------------------------
      - name: Create k3d cluster
        timeout-minutes: 2
        uses: nolar/setup-k3d-k3s@62c9d1bd2bc843275c85d2e7dcd696edc1160eee # v1.1.0
        with:
          # renovate: datasource=github-releases depName=k3s-io/k3s
          version: v1.36.1+k3s1
          # renovate: datasource=github-releases depName=k3d-io/k3d
          k3d-tag: v5.9.0
          github-token: ${{ github.token }}
          k3d-args: >-
            --k3s-arg --disable=metrics-server@server:*
            --k3s-arg --disable=traefik@server:*
      # --------------------------------------------------
      # Deploy & test HelmRelease
      # --------------------------------------------------
      - name: Test HelmRelease
        run: |
          chmod +x .github/scripts/deploy_helmrelease.sh
          bash .github/scripts/deploy_helmrelease.sh "${{ matrix.helmrelease }}"

  test-summary:
    name: test-summary
    runs-on: ubuntu-latest
    needs:
      - detect
      - test
    if: always()

    steps:
      - name: Build GitHub summary
        run: |
          {
            echo "## HelmRelease test summary"
            echo ""

            echo "### Detect job"
            echo "- Result: **${{ needs.detect.result }}**"
            echo ""

            echo "### Test matrix job"
            echo "- Result: **${{ needs.test.result }}**"
            echo ""

            if [ "${{ needs.test.result }}" = "skipped" ]; then
              echo "ℹ️ No HelmReleases required testing."
            elif [ "${{ needs.test.result }}" = "success" ]; then
              echo "✅ All HelmRelease tests passed."
            else
              echo "❌ One or more HelmRelease tests failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce final status
        run: |
          # Detect must succeed
          if [ "${{ needs.detect.result }}" != "success" ]; then
            echo "Detect job failed"
            exit 1
          fi

          # Test may be success OR skipped (no releases changed)
          if [ "${{ needs.test.result }}" != "success" ] && \
             [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "HelmRelease tests failed"
            exit 1
          fi

          echo "All checks passed"

  
