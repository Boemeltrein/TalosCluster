---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            clusters/main/kubernetes/**/*
            clusters/main/flux-entry/**/*
            repositories/**/*
            .github/workflows/flate.yaml

  flate:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setup-flate.outputs.version }}
    strategy:
      matrix:
        kind:
          - helmrelease
          - kustomization
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Flate
        id: setup-flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5

      - name: Run flate diff
        env:
          FLATE_PATH: ./clusters/main/flux-entry
          FLATE_OUTPUT: github
          FLATE_ALLOW_MISSING_SECRETS: true
          KIND: ${{ matrix.kind }}
        run: |
          flate diff "$KIND" > "$KIND.diff"
          [ -s "$KIND.diff" ] || rm "$KIND.diff"

      - if: ${{ hashFiles(format('{0}.diff', matrix.kind)) != '' }}
        name: Upload diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flate-diff-${{ matrix.kind }}
          path: ${{ matrix.kind }}.diff
          retention-days: 1

  comment:
    if: ${{ !cancelled() }}
    needs: [filter, flate]
    name: Flate - Comment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - if: ${{ needs.flate.result != 'skipped' }}
        name: Download diffs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flate-diff-*
          merge-multiple: true

      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.BOEMEL_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.BOEMEL_ACTIONS_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Add or Update Comment
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          FLATE_RESULT: ${{ needs.flate.result }}
          FLATE_VERSION: ${{ needs.flate.outputs.version }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const read = (path) => { try { return fs.readFileSync(path, 'utf8'); } catch { return ''; } };
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = `<!-- flate -->`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const diffs = {
              Kustomization: read("kustomization.diff"),
              HelmRelease: read("helmrelease.diff"),
            };
            const comparisonSucceeded = process.env.FILTER_RESULT === 'success' && process.env.FLATE_RESULT === 'success';
            const comparisonSkipped = process.env.FILTER_RESULT === 'success' && process.env.FLATE_RESULT === 'skipped';
            const LIMIT = 65000; // GitHub caps comment bodies at 65,536; leave headroom

            const inlineSection = (label, diff) => [
              `<details open><summary>${label} diff</summary>`,
              ``,
              "```diff",
              diff,
              "```",
              ``,
              `</details>`,
            ];
            const linkedSection = (label, diff) => [
              `<details><summary>${label} diff (${diff.length.toLocaleString()} chars — too large to post)</summary>`,
              ``,
              `Diff exceeds GitHub's comment size limit. Download the artifact from the [workflow run](${runUrl}).`,
              ``,
              `</details>`,
            ];

            // Inline every diff, then evict the largest to a link until the whole
            // comment fits — so a small diff never bumps a big one off inline.
            const present = comparisonSucceeded
              ? Object.entries(diffs).filter(([, diff]) => diff.trim())
              : [];
            const status = !comparisonSucceeded && !comparisonSkipped
              ? '> [!WARNING]\n> Comparison did not complete successfully. No current diff is available.'
              : comparisonSkipped
                ? 'No relevant manifest changes. Rendering was skipped.'
                : present.length === 0 ? 'No rendered changes.' : '';
            const linked = new Set();
            const render = () => [
              marker,
              ...(status ? ['', status, ''] : []),
              ...present.flatMap(([label, diff]) =>
                linked.has(label) ? linkedSection(label, diff) : inlineSection(label, diff)),
              ``,
              `<sub>flate${process.env.FLATE_VERSION ? ` ${process.env.FLATE_VERSION}` : ''} · ${comparisonSucceeded ? 'rendered' : 'revision'} \`${process.env.HEAD_SHA.slice(0, 7)}\` · [workflow run →](${runUrl})</sub>`,
            ].join("\n");
            for (const [label] of [...present].sort((a, b) => b[1].length - a[1].length)) {
              if (render().length <= LIMIT) break;
              linked.add(label);
            }

            const body = render();

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            // Clear an old diff even when rendering was skipped, but avoid a new
            // comment on unrelated PRs that have no existing Flate comment.
            if (!existing && comparisonSkipped) return;

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  success:
    if: ${{ !cancelled() }}
    needs:
      - filter
      - flate
      - comment
    name: Flate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
