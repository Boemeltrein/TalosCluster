# ClusterTool configuration.
# Talos settings belong in the patches directory next to this file.
apiVersion: clustertool/v1
kind: ClusterConfig

clusterName: main

# renovate: datasource=github-releases depName=siderolabs/talos
talosVersion: v1.14.5
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.37.2

nodes:
  - name: control-1
    role: control-plane
    address: ${CONTROL1IP}

  # Optional additional nodes:
  # Configure their addresses in kubernetes/config/cluster-secrets.sops.yaml and create matching
  # patches/nodes/<name>/ directories before enabling them.
  #
  # - name: control-2
  #   role: control-plane
  #   address: ${CONTROL2IP}
  #
  # - name: worker-1
  #   role: worker
  #   address: ${WORKER1IP}

# Cilium and the kubelet CSR approver are installed before this list.
# Chart and CRD names refer to HelmRelease metadata.name. All steps run in order.
bootstrap:
  - crd: kube-prometheus-stack
  - manifest: kubernetes/config/cluster-secrets.sops.yaml
  - manifest: kubernetes/apps/flux-system/flux-instance/app/deploy-key.sops.yaml
  - manifest: kubernetes/apps/flux-system/sops-age.sops.yaml
  - chart: cert-manager
  - chart: clusterissuer
    wait: false
  - chart: metallb
  - chart: metallb-config
  - chart: snapshot-controller
  - chart: longhorn
  - manifest: kubernetes/apps/system/longhorn/app/volumeSnapshotClass.yaml
  - chart: volsync
  - chart: cloudnative-pg
  - chart: flux-operator
  - chart: flux-instance
    wait: false
