---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: not-used
spec:
  values:
    credentials:
      minio:
        type: s3
        url: "http://${S3_URL}"
        bucket: "${S3_BUCKET:=ci_dummy}-APP"
        accessKey: "${S3_ACCESKEY:=ci_dummy}"
        secretKey: "${S3_SECRETKEY:=ci_dummy}"
        encrKey: "${S3_ENCRKEY:=ci_dummy}"
      blaze:
        type: s3
        url: "https://${S3_BLAZE_URL}"
        bucket: "${S3_BLAZE_BUCKET:=ci_dummy}"
        accessKey: "${S3_BLAZE_ACCESKEY:=ci_dummy}"
        secretKey: "${S3_BLAZE_SECRETKEY:=ci_dummy}"
        encrKey: "${S3_BLAZE_ENCRKEY:=ci_dummy}"
      garage:
        type: s3
        url: "http://${S3_GARAGE_URL}"
        bucket: "${S3_GARAGE_BUCKET:=ci_dummy}-APP"
        accessKey: "${S3_GARAGE_ACCESKEY:=ci_dummy}"
        secretKey: "${S3_GARAGE_SECRETKEY:=ci_dummy}"
        encrKey: "${S3_GARAGE_ENCRKEY:=ci_dummy}"
      rustfs:
        type: s3
        url: "http://${S3_RUSTFS_URL}"
        bucket: "${S3_RUSTFS_BUCKET:=ci_dummy}-APP"
        accessKey: "${S3_RUSTFS_ACCESKEY:=ci_dummy}"
        secretKey: "${S3_RUSTFS_SECRETKEY:=ci_dummy}"
        encrKey: "${S3_RUSTFS_ENCRKEY:=ci_dummy}"
      aistor:
        type: s3
        url: "https://${S3_AISTOR_URL}"
        bucket: "${S3_AISTOR_BUCKET:=ci_dummy}-APP"
        accessKey: "${S3_AISTOR_ACCESKEY:=ci_dummy}"
        secretKey: "${S3_AISTOR_SECRETKEY:=ci_dummy}"
        encrKey: "${S3_AISTOR_ENCRKEY:=ci_dummy}"