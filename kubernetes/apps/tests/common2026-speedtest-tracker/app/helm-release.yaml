---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/main/truecharts/public/schemas/helm-release/32.2.1.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speedtest-tracker-test
  namespace: speedtest-tracker-test
spec:
  interval: 1h
  chart:
    spec:
      chart: test-template
      version: 22.0.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:

    image:
      repository: ghcr.io/linuxserver/speedtest-tracker
      pullPolicy: IfNotPresent
      tag: 1.15.1@sha256:2bab9283fb51ac866048028516e542da3bdb7d1858fa2a6b2009972143716433

    TZ: Europe/Amsterdam

    service:
      main:
        ports:
          main:
            targetPort: 80
            port: 9004

    route:
      main:
        enabled: true
        kind: HTTPRoute
        gateway: envoy-internal
        gatewayNamespace: envoy-gateway
        hostnames:
          - speedtest-tracker-test.${BASE_DOMAIN}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare
          homepage:
            enabled: true
            group: "Network"
            widget:
              type: "speedtest"

    persistence:
      varrun:
        enabled: false    
      config:
        enabled: true
        mountPath: "/config"
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true        

    dependencies:
      valkey:
        enabled: true

      postgresql:
        enabled: true
        mode: operator
        depconfig:
          postgresqlUsername: speedtest-tracker
          postgresqlDatabase: speedtest-tracker
        operator:
          # Change to "recovery", when bootstrapping from a backup.
          mode: standalone
          cluster:
            singleNode: true
          monitoring:
            enablePodMonitor: true
          backups:
            enabled: true
            credentials: rustfs
            retentionPolicy: "14d"
          recovery:
            credentials: rustfs
        
    securityContext:
      container:
        runAsNonRoot: false
        readOnlyRootFilesystem: false
        runAsUser: 0
        runAsGroup: 0
    workload:
      main:
        podSpec:
          containers:
            main:
              securityContext:
                capabilities:
                  add:
                    - SYS_CHROOT
                    - KILL
              probes:
                liveness:
                  enabled: true
                  type: http
                  path: /api/healthcheck
                startup:
                  enabled: true
                  type: http
                  path: /api/healthcheck
                readiness:
                  enabled: true
                  type: http
                  path: /api/healthcheck
              env:
                APP_URL: ""
                DB_CONNECTION: pgsql
                DB_HOST:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                    key: plainhost
                DB_PORT: "5432"
                DB_DATABASE: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
                DB_USERNAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
                DB_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                    key: postgresql-password
                APP_KEY:
                  secretKeyRef:
                    name: speedtest-tracker-secrets
                    key: APP_KEY
                MAIL_MAILER: "smtp"
                MAIL_PORT: 465
                MAIL_USERNAME: ""
                MAIL_PASSWORD: ""
                MAIL_SCHEME: "SSL"
                MAIL_FROM_ADDRESS: ""
                MAIL_FROM_NAME: "Speedtest Tracker"
                TELEGRAM_BOT_TOKEN: ""
                CACHE_DRIVER: redis
                REDIS_URL:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                    key: url
                APP_NAME: "Speedtest Tracker"
                PUBLIC_DASHBOARD: false
                CHART_DATETIME_FORMAT: "d.m H:i"
                DATETIME_FORMAT: "d.m.Y H:i"
                SPEEDTEST_SCHEDULE: "0 * * * *"
                PRUNE_RESULTS_OLDER_THAN: 90
                DISPLAY_TIMEZONE: "Europe/Amsterdam"
                SPEEDTEST_SERVERS: "52857"

    resources:
      requests:
        cpu: 10m

    secret:
      speedtest-tracker-secrets:
        enabled: true
        data:
          APP_KEY: "base64:nej73il4Zfu9ol9g9Np/TKmmrnTL8YbOp6TXkf7KhG0="