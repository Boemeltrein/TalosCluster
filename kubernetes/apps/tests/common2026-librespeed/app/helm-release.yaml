---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/main/truecharts/public/schemas/helm-release/32.2.1.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librespeed
  namespace: librespeed
spec:
  interval: 1h
  chart:
    spec:
      chart: test-template
      version: 22.1.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:

    image:
      repository: ghcr.io/linuxserver/librespeed
      tag: 6.3.1@sha256:ad54c25a773cd7bfad5fd5dd82a4987a899edb0a9762e285c842eeb16bef4244
      pullPolicy: IfNotPresent

    service:
      main:
        ports:
          main:
            port: 10016
            targetPort: 80

    TZ: Europe/Amsterdam

    route:
      main:
        enabled: true
        gateway: envoy-internal
        gatewayNamespace: envoy-gateway
        hostnames:
          - librespeed.${DOMAIN}   
        integrations:
          envoy:
            enabled: true
            auth:
              type: authelia
              internalHost: authelia.authelia:9091

    persistence:
      config:
        enabled: true
        mountPath: "/config"       
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true

    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0

    resources:
      requests:
        cpu: 10m
