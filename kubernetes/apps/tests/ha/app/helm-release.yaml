---
# yaml-language-server: $schema=../../../../../.schemas/truecharts-helmrelease.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ha
  namespace: ha
spec:
  interval: 1h
  chart:
    spec:
      chart: home-assistant
      version: 32.2.5
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    service:    
      main:
        type: LoadBalancer
        loadBalancerIP: 192.168.1.230
        integrations:
          metallb:
            enabled: true