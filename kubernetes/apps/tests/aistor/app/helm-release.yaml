---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aistor
  namespace: aistor
spec:
  interval: 1h
  chart:
    spec:
      chart: aistor
      version: 2.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    minio:
      licence: "${MINIO_LICENCE}"
      rootUser: minio
      rootPassword: minio123
      browserRedirectUrl: https://minio.${DOMAIN}

    route:
      main:
        enabled: true
        gateway: envoy-internal
        gatewayNamespace: envoy-gateway
        hostnames:
          - minio.${DOMAIN}
      api:
        enabled: true
        gateway: envoy-internal
        gatewayNamespace: envoy-gateway
        targetSelector:
          api: api
        hostnames:
          - minioapi.${DOMAIN}
