---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
  namespace: konflate
spec:
  interval: 1h
  chart:
    spec:
      chart: konflate
      version: 0.6.6
      sourceRef:
        kind: HelmRepository
        name: home-operations
        namespace: flux-system
  values:
    config:
      repo: github://Boemeltrein/TalosCluster
      clusterPath: ./kubernetes/flux-entry
      closedPrMax: 0
      closedPrTtl: 720h      
      statusChecks: true
      prComments: true
      publicUrl: https://konflate.${DOMAIN}
      helmApiVersions: >-
        gateway.envoyproxy.io/v1alpha1/SecurityPolicy
        barmancloud.cnpg.io/v1/ObjectStore
    secret:
      existingSecret: konflate-secret

    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
      parentRefs:
       - name: envoy-external
         namespace: envoy-gateway
      hostnames:
        - konflate.${DOMAIN}

    persistence:
      enabled: true

    monitoring:
      serviceMonitor:
        enabled: true

    resources:
      requests:
        cpu: 50m
      limits:
        memory: 1Gi
