---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  interval: 1h
  chart:
    spec:
      chart: gatus
      version: 6.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam
    
    route:
      main:
        enabled: true
        gateway: envoy-external
        gatewayNamespace: envoy-gateway
        hostnames:
          - status.${DOMAIN}

    sidecar:
      enable: true
      enableService: true
      enableIngress: true
      enableHttproute: true
      autoService: false
      autoIngress: true
      autoHttproute: true

    dependencies:
      postgresql:
        operator:
          cluster:
            instances: 1
          monitoring:
            enablePodMonitor: true

    configmap:
      config:
        enabled: true
        data:
          config.yaml: |
            {{- if .Values.dependencies.postgresql.enabled }}
            storage:
              type: postgres
              # Build the env reference during Helm rendering to avoid Flux substitution.
              path: {{ printf "%s{GATUS_DB_URL}?client_encoding=utf8" "$" | quote }}
            {{- end }}
            ui:
              title: Status | Gatus
              header: Status
              logo: https://avatars.githubusercontent.com/u/130394941
              link: https://github.com/Boemeltrein
              buttons:
                - name: Github
                  link: https://github.com/Boemeltrein
                - name: TalosCluster
                  link: https://github.com/Boemeltrein/TalosCluster
            metrics: true
            alerting:
              discord:
                webhook-url: ${GATUS_WEBHOOK}
                default-alert:
                  description: "health check failed"
                  send-on-resolved: true
                overrides:
                  - group: "buddy"
                    webhook-url: ${GATUS_BUDDY_ALERT_WEBHOOK}
            endpoints:
              - name: Cloudflare
                group: connectivity
                url: icmp://1.1.1.1
                interval: 1m
                conditions:
                  - "[CONNECTED] == true"
              - name: Google
                group: connectivity
                url: icmp://8.8.8.8
                interval: 1m
                conditions:
                  - "[CONNECTED] == true"
              - name: Quad9
                group: connectivity
                url: icmp://9.9.9.9
                interval: 1m
                conditions:
                  - "[CONNECTED] == true"
              - name: Status Page (Buddy)
                group: buddy
                url: https://${GATUS_BUDDY_STATUS_HOSTNAME}
                interval: 1m
                ui:
                  hide-url: true
                  hide-hostname: true
                conditions:
                  - "[STATUS] == 200"
                  - "[BODY].status == UP"
                alerts:
                  - type: discord
                    minimum-reminder-interval: 12h
              - name: Ping (Buddy)
                group: buddy
                url: icmp://${GATUS_BUDDY_DDNS_HOSTNAME}
                interval: 1m
                ui:
                  hide-url: true
                  hide-hostname: true
                conditions:
                  - "[CONNECTED] == true"
                alerts:
                  - type: discord
                    minimum-reminder-interval: 12h
            external-endpoints:
              - name: Heartbeat (Buddy)
                group: buddy
                token: ${GATUS_BUDDY_HEARTBEAT_TOKEN}
                heartbeat:
                  interval: 5m
                alerts:
                  - type: discord
                    minimum-reminder-interval: 12h
