---
# yaml-language-server: $schema=../../../../../.schemas/truecharts-helmrelease.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: blocky
spec:
  interval: 1h
  chart:
    spec:
      chart: blocky
      version: 24.3.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    k8sgatewayImage:
      repository: codeberg.org/k8s-gateway/k8s_gateway
      tag: 1.9.0@sha256:0b556f261d46873d7d2e86e5d345bb99db30de6b3869b83e32d273a466e980e4
  
    TZ: Europe/Amsterdam

    ingress:
      main:
        enabled: true
        ingressClassName: internal
        annotations:
          gatus.home-operations.com/endpoint: |
            path: ""
        hosts:
          - host: blocky.${BASE_DOMAIN}
            paths:
              - path: /
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare

    service:    
      dns:
        externalTrafficPolicy: Local
        type: LoadBalancer
        loadBalancerIP: ${IP_BLOCKY}
        integrations:
          metallb:
            enabled: true
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |
            group: services
            interval: 60s
            ui:
              hide-url: true
              hide-hostname: true
            conditions:
              - "[CONNECTED] == true"
              - "[RESPONSE_TIME] < 100"
            alerts:
              - type: discord

    # -- set the default DNS upstream servers
    defaultUpstreams:
      - tcp-tls:1.1.1.1:853
      - tcp-tls:1.0.0.1:853


    # -- Configuration for caching of DNS responsesg
    caching:
      cacheTimeNegative: 1m

    # -- set conditional settings
    conditional:
      mapping:
        - domain: thuis
          dnsserver: 192.168.1.1
        - domain: test.${DOMAIN}
          dnsserver: 192.168.1.157

    clientLookup:
      # -- upstream used for client-name lookup
      upstream: "192.168.1.1"

    # -- set blocking settings using Lists
    blocking:
      # --  Add blocky whitelists
      # `default` name is reservered for TrueCharts included default whitelist
      # example shows the structure, though name should be changed when used
      whitelist:
        []
        # - name: default
        #  lists:
        #   - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/optional-list.txt
        #   - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt
        #   - https://raw.githubusercontent.com/rahilpathan/pihole-whitelist/main/1.LowWL.txt

      # -- Blocky blacklists
      # `default` name is reservered for TrueCharts included default blacklist
      # example shows the structure, though name should be changed when used
      blacklist:
        []
        # - name: default
        #  lists:
        #   - https://big.oisd.nl/domainswild
        #   - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts

      # -- Blocky clientGroupsBlock
      clientGroupsBlock:
        - name: default
          groups:
            - default

    queryLog:
      # optional one of: mysql, postgresql, csv, csv-client. If empty, log to console
      type: "postgresql"

    configmap:
      dashboard:
        enabled: false
      datasource:
        enabled: false

    cnpg:
      main:
        cluster:
          singleNode: true
        monitoring:
          enablePodMonitor: true

    k8sgateway:
      # -- list of processed domains
      domains:
        - domain: ${DOMAIN}
          # -- Optional configuration option for DNS01 challenge that will redirect all acme
          # challenge requests to external cloud domain (e.g. managed by cert-manager)
          # See: https://cert-manager.io/docs/configuration/acme/dns01/
          dnsChallenge:
            enabled: false
            domain: dns01.clouddns.com

      forward:
        enabled: false
        primary: tls://1.1.1.1
        secondary: tls://1.0.0.1
        options:
          - name: tls_servername
            value: cloudflare-dns.com

# -- Create a ClusterRole and ClusterRoleBinding
# used by k8sgateway
rbac:
  main:
    # -- Enables or disables the ClusterRole and ClusterRoleBinding
    enabled: true
    primary: true
    clusterWide: true
    # -- Set Rules on the ClusterRole
    rules:
      # General CRDs
      - apiGroups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - watch
      # Ingress
      - apiGroups:
          - extensions
          - networking.k8s.io
        resources:
          - ingresses
        verbs:
          - list
          - watch
      # Service
      - apiGroups:
          - ""
        resources:
          - services
          - namespaces
        verbs:
          - list
          - watch
      # EndpointSlices required by the Service watcher
      - apiGroups:
          - discovery.k8s.io
        resources:
          - endpointslices
        verbs:
          - list
          - watch
      # Gateway, ListenerSet, HTTPRoute, TLSRoute, GRPCRoute
      - apiGroups:
          - gateway.networking.k8s.io
        resources:
          - "*"
        verbs:
          - watch
          - list
      # DNSEndpoint
      - apiGroups:
          - externaldns.k8s.io
        resources:
          - dnsendpoints
        verbs:
          - get
          - watch
          - list
      - apiGroups:
          - externaldns.k8s.io
        resources:
          - dnsendpoints/status
        verbs:
          - "*"
      # Node
      - apiGroups:
          - ""
        resources:
          - nodes
        verbs:
          - list
          - watch