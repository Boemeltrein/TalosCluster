---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 1h
  chart:
    spec:
      chart: home-assistant
      version: 33.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    route:
      main:
        enabled: true
        gateway: envoy-internal
        gatewayNamespace: envoy-gateway
        hostnames:
          - homeassistant.${DOMAIN}
        integrations:
          homepage:
            enabled: true
            group: "Network"
            widget:
              custom:
                key: "${HP_API_HASS}"

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      p1meter:
        enabled: true
        type: device
        hostPath: /dev/serial/by-id/usb-FTDI_P1_Converter_Cable_A6X1Y2R3-if00-port0

    dependencies:
      postgresql:
        operator:
          cluster:
            instances: 1
            singleNode: true
          mode: recovery
          backups:
            enabled: true
            credentials: rustfs
            retentionPolicy: "14d"
          recovery:
            credentials: rustfs
          monitoring:
            enablePodMonitor: true
