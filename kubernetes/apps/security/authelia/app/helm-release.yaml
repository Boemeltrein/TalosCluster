---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 1h
  chart:
    spec:
      chart: authelia
      version: 35.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: authelia-configfile
      valuesKey: values.yaml 
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    route:
      main:
        enabled: true
        gateway: envoy-external
        gatewayNamespace: envoy-gateway
        hostnames:
          - auth.${DOMAIN}

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      secrets:
        enabled: true
        type: secret
        objectName: authelia-oidc-secret
        expandObjectName: false
        mountPath: /config/secret
        readOnly: true

    dependencies:
      postgresql:
        operator:
          cluster:
            instances: 1
            singleNode: true
          mode: recovery
          backups:
            enabled: true
            credentials: rustfs
            retentionPolicy: "14d"
          recovery:
            credentials: rustfs
          monitoring:
            enablePodMonitor: true

    workload:
      main:
        replicas: 1
        podSpec:
          containers:
            main:
              env:
                X_AUTHELIA_CONFIG_FILTERS: template

    secret:
      env-secrets:
        data:
          AUTHELIA_SESSION_SECRET: "${AUTHELIA_SESSION_KEY}"
          AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "${AUTHELIA_JWT_KEY}"
          AUTHELIA_STORAGE_ENCRYPTION_KEY: "${AUTHELIA_ENCRYPTION_KEY}"

    resources:
      requests:
        cpu: 10m
