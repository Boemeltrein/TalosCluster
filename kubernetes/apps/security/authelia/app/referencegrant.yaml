# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/referencegrant_v1beta1.json
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: 'example-ref-authelia-svc'
  namespace: 'authelia'
spec:
  from:
    - group: 'gateway.envoyproxy.io'
      kind: 'SecurityPolicy'
      namespace: 'librespeed'
    - group: 'gateway.envoyproxy.io'
      kind: 'SecurityPolicy'
      namespace: minecraft-java
    - group: 'gateway.envoyproxy.io'
      kind: 'SecurityPolicy'
      namespace: minecraft-stats
    - group: 'gateway.envoyproxy.io'
      kind: 'SecurityPolicy'
      namespace: webserver-dynmap

  to:
    - group: ''
      kind: 'Service'
      name: 'authelia'