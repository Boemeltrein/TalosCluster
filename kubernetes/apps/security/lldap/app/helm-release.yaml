---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
  namespace: lldap
spec:
  interval: 1h
  chart:
    spec:
      chart: lldap
      version: 11.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                LLDAP_HTTP_URL: https://lldap.${BASE_DOMAIN}
                LLDAP_LDAP_BASE_DN: dc=${DN},dc=${DC}
                LLDAP_LDAP_USER_DN: admin
                LLDAP_LDAP_USER_EMAIL: admin@${DOMAIN}
                LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET: true
                LLDAP_SMTP_OPTIONS__FROM: LLDAP Admin <no-reply@${DOMAIN}>
                LLDAP_SMTP_OPTIONS__PORT: 465
                LLDAP_SMTP_OPTIONS__REPLY_TO: Do not reply <no-reply@${DOMAIN}>
                LLDAP_SMTP_OPTIONS__SERVER: ${SMTP_HOST}
                LLDAP_SMTP_OPTIONS__SMTP_ENCRYPTION: TLS
                LLDAP_SMTP_OPTIONS__USER: ${SMTP_USER}
                LLDAP_key_file: /data/private_key

    lldap:
      jwtSecret: "${LLDAP_JWT_SECRET}"                

    secret:
      env-secrets:
        data:
          LLDAP_LDAP_USER_PASS: "${LLDAP_PASSWORD}"
          LLDAP_SMTP_OPTIONS__PASSWORD: "${SMTP_PASSWORD}"

    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: lldap.${BASE_DOMAIN}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare

    persistence:
      data:
        volsync:
          - name: data
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true

    dependencies:
      postgresql:
        operator:
          pgVersion: 16
          cluster:
            instances: 1
            singleNode: true
          mode: recovery
          backups:
            enabled: true
            credentials: rustfs
            retentionPolicy: "14d"
          recovery:
            credentials: rustfs
          monitoring:
            enablePodMonitor: true

    resources:
      requests:
        cpu: 10m
