---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: plex
spec:
  interval: 1h
  chart:
    spec:
      chart: plex
      version: 24.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  timeout: 80m
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    plex:
      # User Defined
      serverIP: "${IP_PLEX}"
      # Preserve advertised URLs while the chart only derives them from ingress.
      additionalAdvertiseURL: "https://plex.${DOMAIN}:443,https://plex.${DOMAIN}:32400"
      disableGDM: true
      requireHTTPS: true # First Deploy set to false, till remote acces is configured and working

    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${IP_PLEX}
        integrations:
          metallb:
            enabled: true

    route:
      main:
        enabled: true
        gateway: envoy-internal
        gatewayNamespace: envoy-gateway
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 401"]
        hostnames:
          - plex.${DOMAIN}
        integrations:
          homepage:
            enabled: true
            group: "Media"
            widget:
              custom:
                key: "${HP_API_PLEX}"
        rules:
          - backendRefs:
              - group: gateway.envoyproxy.io
                kind: Backend
                name: plex

    extraTpl:
      - apiVersion: gateway.envoyproxy.io/v1alpha1
        kind: Backend
        metadata:
          name: plex
          namespace: '{{ .Release.Namespace }}'
        spec:
          type: KubernetesService
          kubernetesService:
            name: plex
            port: 32400
          tls:
            insecureSkipVerify: true

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      videos:
        enabled: true
        type: nfs
        server: 192.168.1.50
        path: /mnt/HDD_Cluster/Videos
        mountPath: /data/videos
      muziek:
        enabled: true
        type: nfs
        server: 192.168.1.50
        path: /mnt/HDD_Cluster/Muziek
        mountPath: /data/muziek
