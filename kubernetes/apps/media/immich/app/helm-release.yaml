---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 1h
  chart:
    spec:
      chart: immich
      version: 36.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: immich.${BASE_DOMAIN}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare
          homepage:
            enabled: true
            group: "Media"
            widget:
              custom:
                key: "${HP_API_IMMICH}"
                version: "2"

    persistence:
      library:
        type: nfs
        server: 192.168.1.50
        path: /mnt/SSD_Cluster/app_immich/library
      uploads:
        type: nfs
        server: 192.168.1.50
        path: /mnt/SSD_Cluster/app_immich/uploads
      backups:
        type: nfs
        server: 192.168.1.50
        path: /mnt/SSD_Cluster/app_immich/backups
      thumbs:
        type: nfs
        server: 192.168.1.50
        path: /mnt/SSD_Cluster/app_immich/thumbs
      profile:
        type: nfs
        server: 192.168.1.50
        path: /mnt/SSD_Cluster/app_immich/profile
      video:
        type: nfs
        server: 192.168.1.50
        path: /mnt/SSD_Cluster/app_immich/encoded-video
      afbeeldingen:
        enabled: true
        type: nfs
        server: 192.168.1.50
        path: /mnt/HDD_Cluster/Afbeeldingen
        mountPath: /mnt/afbeeldingen
        readOnly: true
        targetSelector:
          main:
            main: {}
          microservices:
            microservices: {}

    dependencies:
      postgresql:
        operator:
          cluster:
            instances: 1
            singleNode: true
          mode: recovery
          backups:
            enabled: true
            credentials: rustfs
            retentionPolicy: "14d"
          recovery:
            credentials: rustfs
          monitoring:
            enablePodMonitor: true          
