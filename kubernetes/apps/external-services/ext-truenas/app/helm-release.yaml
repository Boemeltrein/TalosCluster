---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ext-truenas
  namespace: external-services
spec:
  interval: 1h
  chart:
    spec:
      chart: external-service
      version: 19.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    service:
      main:
        type: ExternalIP
        externalIP: "192.168.1.50"
        useSlice: true
        ports:
          main:
            protocol: http
            port: 80

    route:
      main:
        enabled: true
        gateway: envoy-internal
        gatewayNamespace: envoy-gateway
        hostnames:
          - truenas.${DOMAIN}
        integrations:
          homepage:
            enabled: true
            name: "TrueNAS"
            description: "Network Attached Storage"
            group: "Network"
            icon: "https://avatars.githubusercontent.com/u/53482242"
            widget:
              custom:
                type: "truenas"
                key: "${HP_API_TRUENAS}"
                enablePools: "true"
