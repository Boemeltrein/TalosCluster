---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ext-unifi
  namespace: external-services
spec:
  interval: 1h
  chart:
    spec:
      chart: external-service
      version: 19.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    service:
      main:
        type: ExternalIP
        externalIP: "192.168.1.1"
        useSlice: true
        ports:
          main:
            protocol: https
            port: 443

    route:
      main:
        enabled: true
        gateway: envoy-internal
        gatewayNamespace: envoy-gateway
        hostnames:
          - unifi.${DOMAIN}
        integrations:
          homepage:
            enabled: true
            name: "Unify"
            description: "Cloud Gateway Ultra"
            group: "Network"
            icon: "https://logos-world.net/wp-content/uploads/2025/01/UniFi-Logo.png"
            widget:
              custom:
                type: "unifi"
                username: "${HP_UNIFI_USER}"
                password: "${HP_UNIFI_PASS}"
        rules:
          - backendRefs:
              - group: gateway.envoyproxy.io
                kind: Backend
                name: ext-unifi-external-service

    extraTpl:
      - apiVersion: gateway.envoyproxy.io/v1alpha1
        kind: Backend
        metadata:
          name: ext-unifi-external-service
          namespace: '{{ .Release.Namespace }}'
        spec:
          type: KubernetesService
          kubernetesService:
            name: ext-unifi-external-service
            port: 443
          tls:
            insecureSkipVerify: true
