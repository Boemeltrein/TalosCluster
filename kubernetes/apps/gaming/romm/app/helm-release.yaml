---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm
  namespace: romm
spec:
  interval: 1h
  chart:
    spec:
      chart: romm
      version: 22.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    securityContext:
      container:
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
      pod:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                HASHEOUS_API_ENABLED: true
                
    secret:
      env-secrets:
        data:
          ROMM_AUTH_SECRET_KEY: "${ROMM_AUTH_SECRET_KEY}"
  
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: romm.${BASE_DOMAIN}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: cloudflare

    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      assets:
        volsync:
          - name: assets
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      resources:
        volsync:
          - name: resources
            type: restic
            credentials: rustfs
            dest: #VolSync Destination (Restore)
              enabled: true
            src: #VolSync Source (Backup)
              enabled: true
      library:
        enabled: true
        type: nfs
        server: 192.168.1.50
        path: /mnt/HDD_Cluster/Romms
        mountPath: /romm/library
      uploads:
        enabled: true
        type: emptyDir
        mountPath: /romm/tmp
      nginx-conf:
        enabled: true
        type: emptyDir        
        mountPath: /etc/nginx/conf.d

    dependencies:
      postgresql:
        operator:
          cluster:
            instances: 1
            singleNode: true
          mode: recovery
          backups:
            enabled: true
            credentials: rustfs
            retentionPolicy: "14d"
          recovery:
            credentials: rustfs
          monitoring:
            enablePodMonitor: true
