---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: webserver-dynmap
  namespace: webserver-dynmap
spec:
  interval: 1h
  chart:
    spec:
      chart: static-web-server
      version: 10.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Europe/Amsterdam

    global:
      stopAll: false

    route:
      main:
        enabled: true
        gateway: envoy-external
        gatewayNamespace: envoy-gateway
        hostnames:
          - dynmap.${DOMAIN}
        integrations:
          envoy:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"

    extraTpl:
      - apiVersion: gateway.networking.k8s.io/v1beta1
        kind: ReferenceGrant
        metadata:
          name: '{{ .Release.Name }}'
          namespace: authelia
        spec:
          from:
            - group: gateway.envoyproxy.io
              kind: SecurityPolicy
              namespace: '{{ .Release.Namespace }}'
          to:
            - group: ""
              kind: Service
              name: authelia

    persistence:
      dynmap:
        enabled: true
        type: nfs
        path: /mnt/SSD_Cluster/app_minecraft_data/dynmap/web
        server: 192.168.1.50
        mountPath: /public
      config:
        enabled: false
