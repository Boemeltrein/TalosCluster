---
# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/websites/refs/heads/main/truecharts/public/schemas/helm-release/32.8.5.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-stats
  namespace: minecraft-stats
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 22.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/xstar97/mc-stats
      pullPolicy: IfNotPresent
      tag: 3.3.1@sha256:342655b591da08ff44ad9df6bdb4352085773f99410f6b21e2b8eff62ab8ba17

    TZ: Europe/Amsterdam

    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsGroup: 0
        runAsUser: 0

    service:
      main:
        ports:
          main:
            port: 8080

    route:
      main:
        enabled: true
        gateway: envoy-external
        gatewayNamespace: envoy-gateway
        annotations:
          gatus.home-operations.com/endpoint: |
            conditions:
              - "[STATUS] == 401"        
        hostnames:
          - mcstats.${DOMAIN}
        integrations:
          envoy:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"

    extraTpl:
      - apiVersion: gateway.networking.k8s.io/v1beta1
        kind: ReferenceGrant
        metadata:
          name: '{{ .Release.Name }}'
          namespace: authelia
        spec:
          from:
            - group: gateway.envoyproxy.io
              kind: SecurityPolicy
              namespace: '{{ .Release.Namespace }}'
          to:
            - group: ""
              kind: Service
              name: authelia

    mcstats:
      utopia:
        server:
          sources:
            - # https://github.com/pdinklag/MinecraftStats/issues/269
              # https://github.com/pdinklag/MinecraftStats/issues/268#issuecomment-4885990880
              path: /data/utopia
              worldName: Utopia/players
        data:
          documentRoot: /config/utopia/public
          eventsDir: /config/utopia/events
          statsDir: /config/utopia/stats
        crown:
          gold: 4
          silver: 2
          bronze: 1
        client:
          defaultLanguage: en
          playersPerPage: 100
          playerCacheUUIDPrefix: 2
          serverName: null
          showLastOnline: true
        players:
          inactiveDays: 365
          updateInactive: false
          profileUpdateInterval: 3
          minPlaytime: 60
          excludeBanned: true
          excludeOps: false
          excludeUUIDs: []
    workload:
      main:
        podSpec:
          initContainers:
            update-config:
              enabled: true
              type: init
              imageSelector: "image"
              command:
                - /bin/sh
                - -c
              args:
                - |
                  set -e
                  {{- range $name, $cfg := $.Values.mcstats }}
                  
                  # Create instance dirs
                  mkdir -p /config/{{ $name }}/
                  
                  # Write config.json
                  cat <<EOF > /config/{{ $name }}/config.json
                  {{ $cfg | toJson }}
                  EOF
                  echo "Created /config/{{ $name }}/config.json"
                  {{- end }}
          containers:
            main:
              env:
                PORT: "{{ .Values.service.main.ports.main.port }}"
                INSTANCES: '{{ keys .Values.mcstats | sortAlpha | join "," }}'
                INTERVAL_SECONDS: 3600
                
    persistence:
      config:
        enabled: true
        targetSelector:
          main:
            main:
              mountPath: /config
            update-config:
              mountPath: /config

      mc-java-data:
        enabled: true
        type: nfs
        path: /mnt/SSD_Cluster/app_minecraft_data
        server: 192.168.1.50
        mountPath: /data/utopia
        readOnly: true
